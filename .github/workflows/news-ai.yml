name: Qatar News Digest (AI, owner-triggered)

# The ONLY workflow that carries the Gemini key. It has no schedule: it runs only when the owner starts it
# (workflow_dispatch), which is interactive owner use. Scheduled digests (news.yml, bot.yml) are deterministic.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: qatar-news-digest
  cancel-in-progress: false

jobs:
  digest-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run digest with Gemini (owner-started)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_MODE: gemini
        run: node ingest.mjs
      - name: Commit state
        run: |
          git config user.name "qatar-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "state: digest (ai) $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
